# Kimi K3 (Moonshot) configuration for PentAGI custom OpenAI-compatible provider.
#
# Moonshot K3 API constraints from official docs:
# - model: kimi-k3
# - base URL: https://api.moonshot.ai/v1
# - thinking mode is always enabled
# - reasoning_effort currently supports only "max"
# - temperature/top_p/n/presence_penalty/frequency_penalty are fixed by the API
#   and should be omitted from requests.
#
# Use with:
#   LLM_SERVER_URL=https://api.moonshot.ai/v1
#   LLM_SERVER_KEY=<your Moonshot API key>
#   LLM_SERVER_MODEL=kimi-k3
#   LLM_SERVER_CONFIG_PATH=./examples/configs/kimi-k3.provider.yml
#   LLM_SERVER_LEGACY_REASONING=true
#   LLM_SERVER_PRESERVE_REASONING=true

simple:
  model: kimi-k3
  n: 1
  max_tokens: 8192
  reasoning:
    effort: max
  price:
    input: 0
    output: 0

